<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sota-arkistohaku</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, "Times New Roman", serif; background: #F0E8D5; color: #1E1A14; min-height: 100vh; }
    header { background: #1B3A28; border-bottom: 3px solid #8C7B52; padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
    .header-title { color: #F0E8D5; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    .header-sub { color: #A89878; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .back-btn { color: #A89878; background: none; border: 1px solid #8C7B52; border-radius: 3px; padding: 6px 14px; font-size: 13px; font-family: Georgia, serif; cursor: pointer; white-space: nowrap; }
    .back-btn:hover { background: #2C4A1C; color: #F0E8D5; }

    /* HAKU */
    #view-search { max-width: 680px; margin: 0 auto; padding: 32px 20px; }
    .search-label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #5C5040; margin-bottom: 8px; }
    .search-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .search-row input { flex: 1; padding: 13px 16px; font-size: 16px; font-family: Georgia, serif; background: #FDF8F0; border: 1.5px solid #B8A880; border-radius: 3px; color: #1E1A14; outline: none; }
    .search-row input:focus { border-color: #1B3A28; }
    .btn-primary { padding: 13px 24px; background: #1B3A28; color: #F0E8D5; border: none; border-radius: 3px; font-size: 14px; font-family: Georgia, serif; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .search-hint { font-size: 12px; color: #8C7B52; font-style: italic; margin-bottom: 24px; }
    .person-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 5px; border: 1px solid #D4C8A8; border-radius: 3px; background: #FDF8F0; cursor: pointer; font-family: Georgia, serif; font-size: 15px; color: #1E1A14; transition: background 0.1s; }
    .person-btn:hover { background: #EDE5D0; border-color: #8C7B52; }
    .placeholder { text-align: center; padding: 48px 16px; color: #8C7B52; }
    .placeholder-icon { font-size: 40px; margin-bottom: 14px; }
    .placeholder p { font-size: 14px; line-height: 1.8; font-style: italic; }

    /* HENKILÖSIVU */
    #view-person { display: none; }
    .person-layout { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 65px); }
    @media (max-width: 800px) { .person-layout { grid-template-columns: 1fr; } }

    .sidebar { background: #FDF8F0; border-right: 1px solid #D4C8A8; padding: 20px; overflow-y: auto; max-height: calc(100vh - 65px); }
    .person-name { font-size: 22px; font-weight: bold; color: #1B3A28; margin-bottom: 3px; }
    .person-rank { font-size: 13px; color: #5C5040; margin-bottom: 16px; }
    .info-block { margin-bottom: 14px; }
    .info-row { font-size: 13px; color: #5C5040; margin-bottom: 3px; }
    .info-row strong { color: #1E1A14; }
    .sec-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #8C7B52; margin-bottom: 8px; display: block; margin-top: 16px; border-top: 1px solid #D4C8A8; padding-top: 14px; }
    .unit-card { background: #F5EFE0; border: 1px solid #D4C8A8; border-radius: 3px; padding: 10px 12px; margin-bottom: 8px; }
    .unit-name { font-size: 14px; font-weight: bold; color: #1B3A28; margin-bottom: 6px; }
    .link-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .ext-link { font-size: 11px; color: #1B3A28; text-decoration: none; border: 1px solid #C8B88A; border-radius: 2px; padding: 3px 8px; }
    .ext-link:hover { background: #F0E8D5; }

    .battle-list { margin-top: 4px; }
    .battle-item { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #EDE5D0; cursor: pointer; }
    .battle-item:last-child { border-bottom: none; }
    .battle-item:hover { background: #F5EFE0; margin: 0 -4px; padding: 7px 4px; border-radius: 2px; }
    .battle-dot { width: 8px; height: 8px; border-radius: 50%; background: #C8B88A; flex-shrink: 0; margin-top: 4px; }
    .battle-dot.map { background: #1B3A28; }
    .battle-name { font-size: 12px; font-weight: bold; color: #1E1A14; }
    .battle-place { font-size: 11px; color: #5C5040; }
    .battle-date { font-size: 11px; color: #8C7B52; }

    /* Narratiivi */
    .narrative-box { background: #F5EFE0; border-left: 4px solid #8C7B52; border-radius: 0 3px 3px 0; padding: 14px 16px; margin-top: 8px; font-size: 13px; line-height: 1.8; color: #2C2416; font-style: italic; }
    .narrative-loading { color: #8C7B52; font-size: 13px; font-style: italic; padding: 8px 0; }

    /* Wikipedia */
    .wiki-box { background: #F0EEE8; border: 1px solid #D4C8A8; border-radius: 3px; padding: 12px; margin-top: 6px; font-size: 12px; line-height: 1.6; color: #3C3426; }
    .wiki-box a { color: #1B3A28; font-size: 11px; }

    /* Kuvat */
    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
    .photo-card { border: 1px solid #D4C8A8; border-radius: 2px; overflow: hidden; text-decoration: none; display: block; }
    .photo-card img { width: 100%; height: 90px; object-fit: cover; display: block; filter: sepia(20%); }
    .photo-card-title { font-size: 10px; padding: 4px 6px; color: #5C5040; line-height: 1.2; }

    /* Sotapolku */
    .sotapolku-btn { display: block; text-align: center; padding: 10px; background: #2C4A1C; color: #F0E8D5; text-decoration: none; border-radius: 3px; font-size: 13px; font-family: Georgia, serif; margin-top: 12px; }
    .sotapolku-btn:hover { background: #1B3A28; }

    /* Kartta */
    .map-area { display: flex; flex-direction: column; }
    #map { flex: 1; min-height: 500px; }
    .map-bar { padding: 10px 16px; background: #1B3A28; color: #A89878; font-size: 12px; display: flex; gap: 20px; }

    .empty { font-size: 13px; color: #8C7B52; font-style: italic; padding: 6px 0; }
    .loading { font-size: 13px; color: #8C7B52; padding: 6px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
<header>
  <button class="back-btn hidden" id="backBtn" onclick="naytaHaku()">← Takaisin hakuun</button>
  <div>
    <div class="header-title">Sota-arkistohaku</div>
    <div class="header-sub">Talvi- ja jatkosodan henkilöhistoria</div>
  </div>
</header>

<!-- HAKU -->
<div id="view-search">
  <label class="search-label">Henkilön nimi</label>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="esim. Korhonen tai Mäkinen Eino" />
    <button class="btn-primary" id="searchBtn" onclick="doSearch()">Hae</button>
  </div>
  <p class="search-hint">Kirjoita sukunimi ensin – esim. "Maaranen" tai "Korhonen Aarne"</p>
  <div id="searchResults">
    <div class="placeholder">
      <div class="placeholder-icon">🏛️</div>
      <p>Hae suomalaisten sotilaiden tietoja<br>talvi- ja jatkosodasta.</p>
    </div>
  </div>
</div>

<!-- HENKILÖSIVU -->
<div id="view-person">
  <div class="person-layout">
    <div class="sidebar" id="sidebar"><p class="loading">Ladataan...</p></div>
    <div class="map-area">
      <div class="map-bar">
        <span>🟢 Taistelupaikka kartalla</span>
        <span>⚪ Ei koordinaatteja</span>
        <span id="mapInfo"></span>
      </div>
      <div id="map"></div>
    </div>
  </div>
</div>

<script>
var persons = [];
var kartta = null;
var merkit = [];

function sparql(q, cb) {
  fetch('/api/sparql?_t=' + Date.now() + '&query=' + encodeURIComponent(q), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(d) { cb(null, d.results && d.results.bindings ? d.results.bindings : []); })
    .catch(function(e) { cb(e.message, []); });
}

function naytaHaku() {
  document.getElementById('view-search').style.display = '';
  document.getElementById('view-person').style.display = 'none';
  document.getElementById('backBtn').classList.add('hidden');
}

function naytaHenkilo() {
  document.getElementById('view-search').style.display = 'none';
  document.getElementById('view-person').style.display = '';
  document.getElementById('backBtn').classList.remove('hidden');
  if (!kartta) {
    kartta = L.map('map').setView([61.5, 30.0], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(kartta);
  }
  merkit.forEach(function(m) { kartta.removeLayer(m); });
  merkit = [];
}

function doSearch() {
  var term = document.getElementById('searchInput').value.trim();
  if (!term) return;
  var btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = 'Haetaan...';
  persons = [];

  var q = 'PREFIX skos: <http://www.w3.org/2004/02/skos/core#>\n' +
    'SELECT DISTINCT ?person ?name WHERE {\n' +
    '  ?person skos:prefLabel ?name .\n' +
    '  FILTER(CONTAINS(LCASE(str(?name)), LCASE("' + term.replace(/"/g,'\\"') + '")))\n' +
    '}\nORDER BY ?name\nLIMIT 30';

  sparql(q, function(err, rows) {
    btn.disabled = false; btn.textContent = 'Hae';
    var el = document.getElementById('searchResults');
    if (!rows.length) {
      el.innerHTML = '<p class="empty">Ei tuloksia nimellä "' + term + '".</p>';
      return;
    }
    persons = rows.map(function(r) { return { uri: r.person.value, name: r.name.value }; });
    el.innerHTML = persons.map(function(p, i) {
      return '<button class="person-btn" onclick="avaaHenkilo(' + i + ')">' +
        '<span>' + p.name + '</span><span style="color:#8C7B52">→</span></button>';
    }).join('');
  });
}

function avaaHenkilo(i) {
  var p = persons[i];
  naytaHenkilo();
  document.getElementById('sidebar').innerHTML = '<p class="loading">Haetaan tietoja Sotasammosta...</p>';
  document.getElementById('mapInfo').textContent = '';

  var q = 'PREFIX skos: <http://www.w3.org/2004/02/skos/core#>\n' +
    'SELECT DISTINCT ?prop ?val ?label WHERE {\n' +
    '  <' + p.uri + '> ?prop ?val .\n' +
    '  OPTIONAL { ?val skos:prefLabel ?label .\n' +
    '    FILTER(langMatches(lang(?label),"fi") || lang(?label)="") }\n' +
    '  FILTER(!isBlank(?val))\n' +
    '} LIMIT 200';

  sparql(q, function(err, rows) {
    var arvo='', syntyma='', kuolema='', kotikunta='', syntymakunta='', ammatti='', kuolinsyy='', kuolinpaikka='';
    var yksikot = [];

    rows.forEach(function(r) {
      var prop=r.prop?r.prop.value:'', val=r.val?r.val.value:'', lbl=r.label?r.label.value:'';
      if (prop.indexOf('rank')>-1 && lbl && !arvo) arvo=lbl;
      if (prop.indexOf('birth_date')>-1 && !syntyma) { var m=val.match(/\d{4}-\d{2}-\d{2}|\d{4}/); if(m) syntyma=m[0]; }
      if ((prop.indexOf('death_date')>-1||prop.indexOf('kuolin')>-1) && !kuolema) { var m2=val.match(/\d{4}-\d{2}-\d{2}|\d{4}/); if(m2) kuolema=m2[0]; }
      if (prop.indexOf('home_municipality')>-1 && lbl && !kotikunta) kotikunta=lbl;
      if (prop.indexOf('birth_municipality')>-1 && lbl && !syntymakunta) syntymakunta=lbl;
      if (prop.indexOf('occupation')>-1 && lbl && !ammatti) ammatti=lbl;
      if (prop.indexOf('death_municipality')>-1 && lbl && !kuolinpaikka) kuolinpaikka=lbl;
      if (prop.indexOf('manner_of_death')>-1 && lbl && !kuolinsyy) kuolinsyy=lbl;
      if ((prop.indexOf('member')>-1||prop.indexOf('unit')>-1) && lbl) {
        if (!yksikot.some(function(u){return u.uri===val;}))
          yksikot.push({uri:val, name:lbl});
      }
    });

    var personData = { nimi:p.name, arvo:arvo, syntyma:syntyma, kuolema:kuolema, kotikunta:kotikunta, syntymakunta:syntymakunta, ammatti:ammatti, kuolinsyy:kuolinsyy, kuolinpaikka:kuolinpaikka };

    var html = '<p class="person-name">' + p.name + '</p>';
    if (arvo) html += '<p class="person-rank">' + arvo + '</p>';
    html += '<div class="info-block">';
    if (syntyma) html += '<p class="info-row">Syntynyt: <strong>' + syntyma + (syntymakunta ? ', ' + syntymakunta : '') + '</strong></p>';
    if (kuolema) html += '<p class="info-row">Kaatunut: <strong>' + kuolema + (kuolinpaikka ? ', ' + kuolinpaikka : '') + '</strong></p>';
    if (kuolinsyy) html += '<p class="info-row">Kuolinsyy: <strong>' + kuolinsyy + '</strong></p>';
    if (kotikunta) html += '<p class="info-row">Kotikunta: <strong>' + kotikunta + '</strong></p>';
    if (ammatti) html += '<p class="info-row">Ammatti: <strong>' + ammatti + '</strong></p>';
    html += '</div>';

    html += '<span class="sec-label">Linkit</span>';
    html += '<div class="link-row">';
    html += '<a href="https://www.sotasampo.fi/fi/persons/?uri=' + encodeURIComponent(p.uri) + '" target="_blank" class="ext-link">Sotasampo ↗</a>';
    html += '<a href="https://sotapolku.fi/henkilot/" target="_blank" class="ext-link">Sotapolku.fi ↗</a>';
    html += '</div>';

    if (yksikot.length) {
      html += '<span class="sec-label">Joukko-osasto</span>';
      yksikot.forEach(function(u) {
        html += '<div class="unit-card"><div class="unit-name">' + u.name + '</div>';
        html += '<div class="link-row"><a href="https://www.sotasampo.fi/fi/units/?uri=' + encodeURIComponent(u.uri) + '" target="_blank" class="ext-link">Sotasampo ↗</a></div></div>';
      });
    }

    html += '<span class="sec-label">Taistelutapahtumat</span>';
    html += '<div id="battles-container"><p class="loading">Haetaan taistelutietoja...</p></div>';
    html += '<span class="sec-label">Kuvaukset</span>';
    html += '<div id="narrative-container"><p class="narrative-loading">Haetaan Wikipedia-tietoja...</p></div>';
    html += '<span class="sec-label">Valokuvat (SA-kuva)</span>';
    html += '<div id="photos-container"><p class="loading">Ladataan...</p></div>';
    html += '<a href="https://sotapolku.fi/henkilot/" target="_blank" class="sotapolku-btn">Avaa Sotapolku.fi ↗</a>';

    document.getElementById('sidebar').innerHTML = html;

    // Hae rinnakkain
    if (yksikot.length) {
      haeTaistelut(yksikot[0].uri, yksikot[0].name, personData);
      haeWikipedia(yksikot[0].name, personData);
      haeKuvat(yksikot[0].name);
    } else {
      document.getElementById('battles-container').innerHTML = '<p class="empty">Ei yksikkötietoa.</p>';
      document.getElementById('narrative-container').innerHTML = '<p class="empty">Ei yksikkötietoa narratiivia varten.</p>';
      haeKuvat(p.name);
    }
  });
}

function haeTaistelut(unitUri, unitName, personData) {
  var q = 'PREFIX skos: <http://www.w3.org/2004/02/skos/core#>\n' +
    'PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>\n' +
    'PREFIX wgs: <http://www.w3.org/2003/01/geo/wgs84_pos#>\n' +
    'SELECT DISTINCT ?ename ?pname ?lat ?lon ?start WHERE {\n' +
    '  ?event crm:P11_had_participant <' + unitUri + '> .\n' +
    '  ?event skos:prefLabel ?ename .\n' +
    '  OPTIONAL { ?event crm:P7_took_place_at ?place .\n' +
    '    ?place skos:prefLabel ?pname .\n' +
    '    OPTIONAL { ?place wgs:lat ?lat ; wgs:long ?lon } }\n' +
    '  OPTIONAL { ?event crm:P4_has_time-span ?ts .\n' +
    '    ?ts crm:P82a_begin_of_the_begin ?start . }\n' +
    '} ORDER BY ?start LIMIT 60';

  sparql(q, function(err, rows) {
    var bc = document.getElementById('battles-container');
    if (!rows.length) {
      bc.innerHTML = '<p class="empty">Ei taistelutietoja Sotasammossa.</p>';
      return;
    }

    var bounds = [];
    var battleData = [];
    var html = '<div class="battle-list">';

    rows.forEach(function(r) {
      var ename = r.ename ? r.ename.value : '';
      var pname = r.pname ? r.pname.value : '';
      var lat   = r.lat  ? parseFloat(r.lat.value)  : null;
      var lon   = r.lon  ? parseFloat(r.lon.value)  : null;
      var start = r.start ? r.start.value.substring(0,10) : '';
      var hasCoords = lat && lon && !isNaN(lat) && !isNaN(lon);

      battleData.push({name:ename, place:pname, date:start});

      if (hasCoords) {
        var m = L.circleMarker([lat,lon], {
          radius:8, fillColor:'#1B3A28', color:'#8C7B52', weight:2, fillOpacity:0.85
        }).addTo(kartta).bindPopup('<strong>'+ename+'</strong>'+(pname?'<br>'+pname:'')+(start?'<br>'+start:''));
        merkit.push(m);
        bounds.push([lat,lon]);
      }

      html += '<div class="battle-item"' + (hasCoords?(' onclick="kartta.setView(['+lat+','+lon+'],11)"'):'') + '>';
      html += '<div class="battle-dot' + (hasCoords?' map':'') + '"></div>';
      html += '<div><div class="battle-name">' + ename + '</div>';
      if (pname) html += '<div class="battle-place">' + pname + '</div>';
      if (start) html += '<div class="battle-date">' + start + '</div>';
      html += '</div></div>';
    });

    html += '</div>';
    bc.innerHTML = html;

    if (bounds.length > 1) kartta.fitBounds(bounds, {padding:[40,40]});
    else if (bounds.length===1) kartta.setView(bounds[0], 10);
    document.getElementById('mapInfo').textContent = bounds.length + ' paikkaa kartalla';

    // Tallenna taistelut narratiivia varten
    window._battleData = battleData;
    haeNarratiivi(personData, unitName, battleData, '');
  });
}

function haeWikipedia(unitName, personData) {
  fetch('/api/wikipedia?yksikko=' + encodeURIComponent(unitName))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var nc = document.getElementById('narrative-container');
      if (!nc) return;
      var wikiHtml = '';
      if (d.teksti) {
        wikiHtml = '<p class="sec-label" style="border-top:none;margin-top:8px">Wikipedia – ' + (d.otsikko||unitName) + '</p>';
        wikiHtml += '<div class="wiki-box">' + d.teksti.substring(0,800) + '...<br><a href="https://fi.wikipedia.org/wiki/' + encodeURIComponent(d.otsikko||unitName) + '" target="_blank">Lue lisää Wikipediassa ↗</a></div>';
      }
      // Lisää Wikipedia-tieto narrative-containerin perään
      nc.innerHTML = (nc.innerHTML || '') + wikiHtml;
    }).catch(function() {});
}

function haeNarratiivi(personData, unitName, battles, diary) {
  var nc = document.getElementById('narrative-container');
  if (nc) nc.innerHTML = '<p class="narrative-loading">⏳ Claude kirjoittaa yhteenvetoa...</p>';

  fetch('/api/narrative', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ person: personData, unit: unitName, battles: battles, diary: diary })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var nc2 = document.getElementById('narrative-container');
    if (!nc2) return;
    if (d.narrative) {
      nc2.innerHTML = '<div class="narrative-box">' + d.narrative.replace(/\n/g,'<br>') + '</div>';
    } else {
      nc2.innerHTML = '<p class="empty">Narratiivia ei saatu.</p>';
    }
    // Lisää Wikipedia tämän jälkeen
    haeWikipedia(unitName, personData);
  })
  .catch(function(e) {
    var nc3 = document.getElementById('narrative-container');
    if (nc3) nc3.innerHTML = '<p class="empty">Narratiivin haku epäonnistui: ' + e.message + '</p>';
  });
}

function haeKuvat(hakusana) {
  fetch('https://api.finna.fi/v1/search?lookfor=' + encodeURIComponent(hakusana) + '&limit=6&filter%5B%5D=building%3A0%2Fsa-kuva%2F')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var el = document.getElementById('photos-container');
      if (!el) return;
      var records = d.records || [];
      if (!records.length) { el.innerHTML = '<p class="empty">Ei SA-kuvia.</p>'; return; }
      el.innerHTML = '<div class="photo-grid">' + records.slice(0,6).map(function(r) {
        var src = r.images&&r.images[0] ? 'https://www.finna.fi'+r.images[0] : null;
        var img = src ? '<img src="'+src+'" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'">'
                     : '<div style="height:90px;background:#E8E0CC;display:flex;align-items:center;justify-content:center;font-size:24px">📷</div>';
        return '<a href="https://www.finna.fi/Record/'+encodeURIComponent(r.id)+'" target="_blank" class="photo-card">'+img+'<div class="photo-card-title">'+(r.title||'').substring(0,50)+'</div></a>';
      }).join('') + '</div>';
    }).catch(function() {
      var el = document.getElementById('photos-container');
      if (el) el.innerHTML = '<p class="empty">Kuvahaun virhe.</p>';
    });
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
